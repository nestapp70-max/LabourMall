<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Article — LabourConnect</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="header"><div class="container bar"><div class="brand"><div class="logo">LC</div>LabourConnect</div><nav class="nav"><a href="index.html">Home</a><a href="blog.html">Blog</a></nav></div></header>

  <main class="container">
    <div class="card">
      <h2 id="post-title">Article title</h2>
      <div class="small" id="post-excerpt">Excerpt</div>
      <div id="post-body" style="margin-top:12px">Full article content...</div>
    </div>

    <div class="footer">© 2025 LabourConnect</div>
  </main>

  <script>
  (function(){
    const qp = new URLSearchParams(location.search);
    const id = qp.get('id') || '1';
    const posts = {
      '1': {title:'How to hire skilled labour safely', excerpt:'Checklist and red flags', body:'Verify identity, ask for photos, check experience...'},
      '2': {title:'Top skills in demand 2025', excerpt:'Which trades are growing', body:'Plumbing, electrical, carpentry... upskilling resources.'}
    };
    const p = posts[id] || posts['1'];
    document.getElementById('post-title').textContent = p.title;
    document.getElementById('post-excerpt').textContent = p.excerpt;
    document.getElementById('post-body').textContent = p.body;
  })();
  </script>
</body>
</html>
