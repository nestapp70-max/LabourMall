<body>
  <header class="header">

  <main class="container">
    
<div class="card">
  <h2 id="post-title">Article title</h2>
  <p class="small" id="post-excerpt">Excerpt</p>
  <div id="post-body" style="margin-top:12px">Full article content (demo).</div>
</div>

<script>
(function(){
  const qp = new URLSearchParams(location.search);
  const id = qp.get('id') || '1';
  const posts = {
    '1': {title:'How to hire skilled labour safely', excerpt:'Checklist and red flags...', body:'Full article content: check references, verify identity, ask for photos of past work.'},
    '2': {title:'Top skills in demand 2025', excerpt:'Which trades are growing...', body:'Full article content: plumbing, electrical, carpentry... upskilling resources.'}
  };
  const p = posts[id] || posts['1'];
  document.getElementById('post-title').textContent = p.title;
  document.getElementById('post-excerpt').textContent = p.excerpt;
  document.getElementById('post-body').textContent = p.body;
})();
</script>

    <footer class="footer">© 2025 LabourConnect — static demo</footer>
  </main>
