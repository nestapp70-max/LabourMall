<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — LabourConnect PRO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-bg center-page">
  <div class="auth-card glass-card">
    <h2>Login</h2>
    <p class="muted">Enter your phone number to receive an OTP.</p>
    <form id="loginForm">
      <label>Phone Number
        <input id="phoneInput" type="tel" placeholder="+91 9#########" required />
      </label>
      <div class="actions">
        <button class="btn primary" type="submit">Send OTP</button>
        <a class="btn ghost" href="index.html">Cancel</a>
      </div>
    </form>
    <small class="muted">By continuing you agree to our Terms & Privacy.</small>
  </div>

  <script src="auth.js"></script>
  <script>
    // login form sends to OTP page (mock)
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const phone = document.getElementById('phoneInput').value.trim();
      if(!phone) return alert('Enter phone');
      // Save to sessionStorage for mock OTP step
      sessionStorage.setItem('lc_phone', phone);
      // In real: call Firebase phone auth or your OTP service to send OTP
      // For demo, we generate OTP and store:
      const otp = Math.floor(100000 + Math.random()*900000);
      sessionStorage.setItem('lc_mock_otp', otp);
      console.info('Mock OTP (for demo):', otp);
      location.href = 'otp.html';
    });
  </script>
</body>
</html>
